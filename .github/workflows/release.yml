name: Release

on:
  push:
    tags:
      - "releases/*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build rpm
          python3 -m pip install 'cmake>=3.31,<5'

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DRPP_ENABLE_CUDA=ON
          -DRPP_ENABLE_TESTS=OFF
          -DRPP_ENABLE_BENCHMARKS=OFF
          -DRPP_ADD_STUB_TARGET=OFF

      - name: Build
        run: cmake --build build

      - name: Package
        run: cpack --config build/CPackConfig.cmake -G 'DEB;RPM' -B dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "${RELEASE_TAG}" dist/*.deb dist/*.rpm
          --verify-tag --generate-notes --title "${RELEASE_TAG}"
